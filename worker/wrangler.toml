name = "blizzard-tracker-api"
main = "worker.js"
compatibility_date = "2026-06-01"

# KV namespace for OAuth tokens + summary cache.
# Create with:  npx wrangler kv namespace create TOKENS
# then paste the generated id below.
[[kv_namespaces]]
binding = "TOKENS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Lock CORS to the deployed app (use "*" while testing locally).
ALLOWED_ORIGIN = "https://bjm6t4gjg5-netizen.github.io"

# Secrets — set via CLI, never commit them:
#   npx wrangler secret put STRAVA_CLIENT_ID
#   npx wrangler secret put STRAVA_CLIENT_SECRET
